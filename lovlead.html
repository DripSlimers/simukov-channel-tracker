<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lovlead · трекер тест-группы</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#fafbfc; --line:#e4e7ec; --line2:#eef0f3;
  --text:#1a1d23; --muted:#6b7280; --accent:#2563eb; --accent-soft:#e8f0fe;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1c2029;--line:#262b34;--line2:#20242d;
  --text:#e7eaef;--muted:#9aa2ad;--accent:#5b8cff;--accent-soft:#1b2740;--shadow:none;}
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:var(--shadow);}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;margin-right:6px;white-space:nowrap;}
.brand span{color:var(--accent)}
.spacer{flex:1}
button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:7px 12px;border-radius:8px;cursor:pointer;transition:.12s;white-space:nowrap;}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{opacity:.9;color:#fff}
button.ghost{background:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:20px;cursor:pointer;
  font-size:12.5px;display:flex;align-items:center;gap:6px;user-select:none}
.chip.active{border-color:var(--accent);background:var(--accent-soft)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip .n{font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input[type=text],input[type=date],textarea,select{font-family:inherit;font-size:13px;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
input[type=text].search{flex:1;min-width:180px}
textarea{width:100%;resize:vertical;min-height:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
  transition:.12s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.card h3{margin:0 0 3px;font-size:15px;padding-left:6px}
.card .contact{color:var(--muted);font-size:12.5px;padding-left:6px;word-break:break-all}
.card .niche{color:var(--muted);font-size:12.5px;margin:8px 0 10px;padding-left:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;padding-left:6px}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;color:#fff;font-weight:600;white-space:nowrap}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-left:6px;
  font-size:11.5px;color:var(--muted)}
.act-count{display:flex;gap:10px}
.empty{text-align:center;color:var(--muted);padding:50px 0}
/* доступ 7 дней */
.acc{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;margin:9px 0 0 6px;white-space:nowrap}
.acc.active{background:rgba(5,150,105,.14);color:#059669}
.acc.expiring{background:rgba(217,119,6,.16);color:#d97706}
.acc.expired{background:rgba(220,38,38,.16);color:#ef4444}
.acc.closed{background:rgba(107,114,128,.14);color:var(--muted)}
.acc.nostart{background:rgba(124,58,237,.16);color:#8b5cf6}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:40;display:none;
  align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  border:1px solid var(--line)}
.modal .top{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:16px 16px 0 0;z-index:2}
.modal .top h2{margin:0;font-size:18px}
.modal .top .contact{color:var(--muted);font-size:13px}
.modal .body{padding:18px 20px}
.close{margin-left:auto;font-size:20px;line-height:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px}
.sec{margin-bottom:20px}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.anketa{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:13px}
.anketa .row{display:flex;gap:8px;padding:3px 0}
.anketa .row b{min-width:120px;color:var(--muted);font-weight:600}
.anketa .row span{white-space:pre-wrap}
.feat{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.statusbar{display:flex;flex-wrap:wrap;gap:6px}
.statusbar .sbtn{border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.statusbar .sbtn.on{color:#fff;border-color:transparent}
.logitem,.listitem{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.logitem .date{color:var(--accent);font-weight:600;min-width:82px;font-size:12px}
.logitem .txt{flex:1;white-space:pre-wrap}
.listitem .txt{flex:1;white-space:pre-wrap}
.listitem .del,.logitem .del{color:var(--muted);cursor:pointer;border:none;background:none;font-size:15px;padding:0 4px}
.listitem .del:hover,.logitem .del:hover{color:#dc2626}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addrow input[type=text]{flex:1;min-width:160px}
.addrow textarea{flex:1;min-width:200px;min-height:38px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13.5px}
.tab.active{color:var(--accent);border-color:var(--accent)}
.agg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 16px;box-shadow:var(--shadow)}
.agg .aitem{padding:11px 0;border-bottom:1px solid var(--line2)}
.agg .aitem:last-child{border:none}
.agg .who{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.saved{font-size:12px;color:#059669;opacity:0;transition:.3s}
.saved.show{opacity:1}
.saved.err{color:#dc2626;opacity:1}
.empty2{text-align:center;color:var(--muted);padding:50px 0}
input[type=email]{font-family:inherit;font-size:13px;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.login{max-width:400px;margin:70px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:28px;box-shadow:var(--shadow);text-align:center}
.login h1{font-size:20px;margin:0 0 6px}
.login p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.login input{margin-bottom:11px;text-align:center}
@media(max-width:520px){.anketa .row{flex-direction:column;gap:0}.anketa .row b{min-width:0}}
</style>
</head>

/* сохранение одного тестера: вся карточка одним jsonb, с дебаунсом */
let saveTimers={};
function saveTester(id){
  clearTimeout(saveTimers[id]);
  saveTimers[id]=setTimeout(async()=>{
    const d=DATA.find(x=>x.id===id);if(!d)return;
    const {error}=await sb.from('lovlead_testers').upsert(

    if(error)flash('не сохранилось: '+error.message,true);else flash('сохранено');
  },400);
}
async function saveAllTesters(){
  if(!DATA.length)return;

/* ===== доступ на 7 дней ===== */
const TRIAL_DAYS=7;
const TRIAL_STATUSES=['Доступ выдан','Активен'];
function todayISO(){return new Date().toISOString().slice(0,10);}
function dayStart(iso){return new Date(iso+'T00:00:00');}
function daysBetween(aISO,bISO){return Math.round((dayStart(bISO)-dayStart(aISO))/86400000);}
function addDaysISO(iso,n){const d=dayStart(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fmtRu(iso){if(!iso)return '';return dayStart(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
function accessInfo(d){
  if(d.access_closed)return {state:'closed'};
  if(!TRIAL_STATUSES.includes(d.status))return {state:'none'};
  if(!d.access_start)return {state:'nostart'};
  const elapsed=daysBetween(d.access_start,todayISO());
  const remaining=TRIAL_DAYS-elapsed;
  const dayNum=Math.min(Math.max(elapsed+1,1),TRIAL_DAYS);
  if(remaining<=0)return {state:'expired',overdue:-remaining,dayNum:TRIAL_DAYS,remaining};
  if(remaining<=2)return {state:'expiring',remaining,dayNum};
  return {state:'active',remaining,dayNum};
}
function accBadge(ai){
  if(ai.state==='active')return `<span class="acc active">🔓 ещё ${ai.remaining} дн.</span>`;
  if(ai.state==='expiring')return `<span class="acc expiring">⏳ ещё ${ai.remaining} дн.</span>`;
  if(ai.state==='expired')return `<span class="acc expired">⛔ доступ истёк — закрой</span>`;
  if(ai.state==='nostart')return `<span class="acc nostart">🔓 отметь дату выдачи</span>`;
  if(ai.state==='closed')return `<span class="acc closed">🔒 доступ закрыт</span>`;
  return '';
}
function accStateText(ai){
  if(ai.state==='active'||ai.state==='expiring')return `день ${ai.dayNum} из ${TRIAL_DAYS} · осталось ${ai.remaining} дн.`;
  if(ai.state==='expired')return ai.overdue===0?`срок вышел сегодня — пора закрыть доступ`:`истёк ${ai.overdue} дн. назад — пора закрыть доступ`;
  if(ai.state==='nostart')return `дата выдачи не отмечена — нажми «Выдал сегодня» или укажи дату`;
  if(ai.state==='closed')return `доступ закрыт`;
  return `отсчёт начнётся после статуса «Доступ выдан» / «Активен»`;
}

function setView(v){view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  document.getElementById('peopleView').style.display = v==='people'?'':'none';
  document.getElementById('aggView').style.display = v==='people'?'none':'';
  render();
}

function renderChips(){
  const box=document.getElementById('chips');
  let h=`<div class="chip ${filter===null?'active':''}" onclick="setFilter(null)"><span class="n">${DATA.length}</span> Все</div>`;
  STATUSES.forEach(s=>{const n=DATA.filter(d=>d.status===s.k).length;
    h+=`<div class="chip ${filter===s.k?'active':''}" onclick="setFilter('${s.k.replace(/'/g,"")}')"><span class="dot" style="background:${s.c}"></span><span class="n">${n}</span> ${s.k}</div>`;});
  const expN=DATA.filter(d=>accessInfo(d).state==='expired').length;
  h+=`<div class="chip ${filter==='__expired__'?'active':''}" style="${expN?'border-color:#dc2626;background:rgba(220,38,38,.10)':''}" onclick="setFilter('__expired__')"><span class="dot" style="background:#dc2626"></span><span class="n">${expN}</span> ⛔ К закрытию</div>`;
  box.innerHTML=h;
}
function setFilter(f){filter=f;render();}

function render(){
  renderChips();
  if(view!=='people'){renderAgg();return;}
  const q=(document.getElementById('search').value||'').toLowerCase();
  const grid=document.getElementById('grid');
  let list;
  if(filter==='__expired__') list=DATA.filter(d=>accessInfo(d).state==='expired');
  else list=DATA.filter(d=>(!filter||d.status===filter));
  if(q)list=list.filter(d=>((d.name+' '+d.niche+' '+d.contact+' '+d.role).toLowerCase().includes(q)));
  if(!list.length){grid.innerHTML=`<div class="empty">Пусто. ${DATA.length?'Смени фильтр или поиск.':'Добавь людей кнопкой «+ Человек».'}</div>`;return;}
  grid.innerHTML=list.map(d=>{
    const c=colorOf(d.status);
    const ai=accessInfo(d);
    const stripeC=ai.state==='expired'?'#dc2626':c;
    const feats=(d.features||[]).slice(0,3).map(f=>`<span class="tag">${esc(f)}</span>`).join('');
    return `<div class="card" onclick="openDetail('${d.id}')">
      <div class="stripe" style="background:${stripeC}"></div>
      <h3>${esc(d.name)}</h3>
      <div class="contact">${esc(d.contact)||'&mdash;'}</div>
      <div class="niche">${esc(d.niche)||esc(d.role)||''}</div>
      <div class="meta"><span class="badge" style="background:${c}">${esc(d.status)}</span>${feats}</div>
      ${accBadge(ai)}
      <div class="foot">
        <span>${esc(d.actuality?d.actuality.split(',')[0]:'')}</span>
        <span class="act-count">${d.log&&d.log.length?('📅 '+d.log.length):''} ${d.questions&&d.questions.length?('❓ '+d.questions.length):''} ${d.improvements&&d.improvements.length?('🛠 '+d.improvements.length):''}</span>
      </div>
    </div>`;}).join('');
}

function renderAgg(){
  const box=document.getElementById('aggView');
  const field = view==='questions'?'questions':'improvements';
  const title = view==='questions'?'вопросов':'доработок';
  let rows=[];
  DATA.forEach(d=>(d[field]||[]).forEach((t,i)=>rows.push({who:d.name,id:d.id,txt:t,idx:i})));
  if(!rows.length){box.innerHTML=`<div class="empty">Пока нет ${title}. Добавляй их в карточках тестеров.</div>`;return;}
  box.innerHTML=`<div class="agg">`+rows.map(r=>`<div class="aitem"><div class="who" style="cursor:pointer" onclick="openDetail('${r.id}')">${esc(r.who)} →</div><div>${esc(r.txt)}</div></div>`).join('')+`</div>`;
}

function openDetail(id){
  openId=id; const d=DATA.find(x=>x.id===id); if(!d)return;
  const anketa=[
    ['Кто',d.role],['Ниша / услуги',d.niche],['Как ищет клиентов',d.source],
    ['Актуальность',d.actuality],
    ['Цена фрилансер',d.price_fr],['Цена студия',d.price_st],['Цена агентство',d.price_ag],
    ['Свой ответ по цене',d.price_own],['Дата анкеты',d.anketa_date],
  ].filter(r=>r[1]).map(r=>`<div class="row"><b>${r[0]}</b><span>${esc(r[1])}</span></div>`).join('');
  const feats=(d.features||[]).map(f=>`<span class="feat">${esc(f)}</span>`).join('')||'<span class="hint">не отмечено</span>';
  const sbtns=STATUSES.map(s=>`<div class="sbtn ${d.status===s.k?'on':''}" style="${d.status===s.k?('background:'+s.c):''}" onclick="setStatus('${d.id}','${s.k}')"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${s.c}"></span>${s.k}</div>`).join('');
  const logs=(d.log||[]).slice().reverse().map((l,ri)=>{const idx=d.log.length-1-ri;
    return `<div class="logitem"><span class="date">${esc(l.date)}</span><span class="txt">${esc(l.text)}</span><button class="del" onclick="delLog('${d.id}',${idx})">×</button></div>`;}).join('')||'<div class="hint">Записей нет. Добавь первую ниже.</div>';
  const ql=(d.questions||[]).map((t,i)=>`<div class="listitem"><span class="txt">${esc(t)}</span><button class="del" onclick="delItem('${d.id}','questions',${i})">×</button></div>`).join('')||'<div class="hint">Вопросов нет.</div>';
  const il=(d.improvements||[]).map((t,i)=>`<div class="listitem"><span class="txt">${esc(t)}</span><button class="del" onclick="delItem('${d.id}','improvements',${i})">×</button></div>`).join('')||'<div class="hint">Доработок нет.</div>';
  const today=new Date().toISOString().slice(0,10);
  const ai=accessInfo(d);
  const accStart=d.access_start||'';
  const accBtns=[
    accStart?'':`<button class="primary" onclick="grantToday('${d.id}')">Выдал сегодня</button>`,
    (accStart&&!d.access_closed)?`<button onclick="closeAccess('${d.id}')">Отметить закрытым</button>`:'',
    d.access_closed?`<button onclick="reopenAccess('${d.id}')">Открыть заново</button>`:'',
    accStart?`<button class="ghost" onclick="clearAccess('${d.id}')">Сбросить срок</button>`:''
  ].join('');
  const accSec=`<div class="sec"><h4>Доступ на ${TRIAL_DAYS} дней</h4>
      <div class="anketa">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">${accBadge(ai)||'<span class="acc closed">нет отсчёта</span>'}<span>${accStateText(ai)}</span></div>
        <div class="addrow" style="margin-top:0;align-items:center">
          <label class="hint" style="display:flex;align-items:center;gap:6px">Выдан:&nbsp;<input type="date" id="accStart" value="${accStart}" onchange="setAccessStart('${d.id}',this.value)"></label>
          ${accBtns}
        </div>
        ${accStart&&!d.access_closed?`<div class="hint" style="margin-top:8px">Доступ закрывать ${fmtRu(addDaysISO(accStart,TRIAL_DAYS))} (${addDaysISO(accStart,TRIAL_DAYS)}) — это ${TRIAL_DAYS}-й день после выдачи.</div>`:''}
      </div>
    </div>`;
  document.getElementById('modal').innerHTML=`
    <div class="top">
      <div><h2>${esc(d.name)}</h2><div class="contact">${esc(d.contact)||'контакт не указан'}</div></div>
      <button class="ghost" style="margin-left:auto;color:#dc2626;border-color:#dc2626" onclick="delPerson('${d.id}')">Удалить</button>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="body">
      <div class="sec"><h4>Статус</h4><div class="statusbar">${sbtns}</div></div>
      ${accSec}
      <div class="sec"><h4>Данные из анкеты</h4><div class="anketa">${anketa}<div class="row"><b>Важные фичи</b><span>${feats}</span></div></div></div>
      <div class="sec"><h4>Дневник по дням</h4>${logs}
        <div class="addrow">
          <input type="date" id="logdate" value="${today}">
          <textarea id="logtext" placeholder="Что было сегодня: зашёл/не зашёл, что сказал, реакция…"></textarea>
          <button class="primary" onclick="addLog('${d.id}')">Добавить</button>
        </div>
      </div>
      <div class="sec"><h4>Вопросы от тестера</h4>${ql}
        <div class="addrow"><input type="text" id="qtext" placeholder="Вопрос, который задал…" onkeydown="if(event.key==='Enter')addItem('${d.id}','questions','qtext')">
        <button class="primary" onclick="addItem('${d.id}','questions','qtext')">+</button></div>
      </div>
      <div class="sec"><h4>Доработки к проекту</h4>${il}
        <div class="addrow"><input type="text" id="itext" placeholder="Что надо доработать по его фидбеку…" onkeydown="if(event.key==='Enter')addItem('${d.id}','improvements','itext')">
        <button class="primary" onclick="addItem('${d.id}','improvements','itext')">+</button></div>
      </div>
      <div class="sec"><h4>Общий комментарий</h4>
        <textarea id="gcomment" placeholder="Заметки по человеку…" onchange="setComment('${d.id}',this.value)">${esc(d.comment)}</textarea>
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');openId=null;render();}
function reopen(){if(openId)openDetail(openId);}

function setStatus(id,s){const d=DATA.find(x=>x.id===id);d.status=s;
  if(TRIAL_STATUSES.includes(s)&&!d.access_start&&!d.access_closed)d.access_start=todayISO();
  saveTester(id);reopen();}
function setAccessStart(id,v){const d=DATA.find(x=>x.id===id);d.access_start=v||'';if(v)d.access_closed=false;saveTester(id);reopen();}
function grantToday(id){const d=DATA.find(x=>x.id===id);d.access_start=todayISO();d.access_closed=false;saveTester(id);reopen();}
function closeAccess(id){const d=DATA.find(x=>x.id===id);d.access_closed=true;saveTester(id);reopen();}
function reopenAccess(id){const d=DATA.find(x=>x.id===id);d.access_closed=false;if(!d.access_start)d.access_start=todayISO();saveTester(id);reopen();}
function clearAccess(id){const d=DATA.find(x=>x.id===id);d.access_start='';d.access_closed=false;saveTester(id);reopen();}
function setComment(id,v){const d=DATA.find(x=>x.id===id);d.comment=v;saveTester(id);}
function addLog(id){const d=DATA.find(x=>x.id===id);const t=document.getElementById('logtext').value.trim();const dt=document.getElementById('logdate').value;
  if(!t)return; d.log=d.log||[]; d.log.push({date:dt||new Date().toISOString().slice(0,10),text:t}); saveTester(id);reopen();}
function delLog(id,i){const d=DATA.find(x=>x.id===id);d.log.splice(i,1);saveTester(id);reopen();}
function addItem(id,field,inputId){const d=DATA.find(x=>x.id===id);const el=document.getElementById(inputId);const t=el.value.trim();
  if(!t)return; d[field]=d[field]||[]; d[field].push(t); saveTester(id);reopen();}
function delItem(id,field,i){const d=DATA.find(x=>x.id===id);d[field].splice(i,1);saveTester(id);reopen();}

function addPerson(){const name=prompt('Имя нового человека:');if(!name)return;
  const id='n'+Date.now();
  DATA.push({id,name,contact:'',role:'',niche:'',source:'',actuality:'',price_fr:'',price_st:'',price_ag:'',price_own:'',features:[],anketa_date:'',status:'Не приглашён',comment:'',log:[],questions:[],improvements:[]});
  saveTester(id);render();openDetail(id);}

async function delPerson(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  if(!confirm('Удалить «'+(d.name||'без имени')+'» без возврата?'))return;
  const {error}=await sb.from('lovlead_testers').delete().eq('user_id',user.id).eq('id',id);
  if(error){alert('Не удалось удалить: '+error.message);return;}
  DATA=DATA.filter(x=>x.id!==id);
  closeModal();render();flash('удалён');
}
async function delAnon(){
  const anon=DATA.filter(d=>String(d.name||'').trim().startsWith('Аноним'));
  if(!anon.length){alert('Анонимов в трекере нет.');return;}
  if(!confirm('Удалить '+anon.length+' анонимов без возврата?'))return;
  const ids=anon.map(d=>d.id);
  const {error}=await sb.from('lovlead_testers').delete().eq('user_id',user.id).in('id',ids);
  if(error){alert('Не удалось удалить: '+error.message);return;}
  DATA=DATA.filter(d=>!ids.includes(d.id));
  render();flash('удалено анонимов: '+ids.length);
}

function doExport(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='lovlead-tracker-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
/* импорт: JSON-массив тестеров (экспорт старого или этого трекера), заливается в Supabase */
async function doImport(e){
  const f=e.target.files[0];if(!f)return;
  e.target.value='';
  let d;
  try{d=JSON.parse(await f.text());}
  catch(x){alert('Не удалось прочитать файл');return;}
  if(!Array.isArray(d)||!d.length){alert('В файле не нашлось списка тестеров');return;}
  const rows=d.map((p,i)=>({user_id:user.id,id:p.id||'n'+Date.now()+'_'+i,data:p}));
  const {error}=await sb.from('lovlead_testers').upsert(rows,{onConflict:'user_id,id'});
  if(error){alert('Импорт с ошибкой: '+error.message);return;}
  await loadAll();
  render();
  alert('Импортировано: '+rows.length+' записей');
}
async function resetSeed(){
  if(!confirm('Загрузить заново всех из анкеты? Текущие изменения в трекере пропадут (сделай Экспорт заранее).'))return;
  const {error}=await sb.from('lovlead_testers').delete().eq('user_id',user.id);
  if(error){alert('Не получилось: '+error.message);return;}
  DATA=structuredClone(SEED);
  await saveAllTesters();
  render();
}

/* ============ вход ============ */
async function sendLink(){
  const email=document.getElementById('email').value.trim();
  const msg=document.getElementById('loginMsg');
  if(!email){msg.innerHTML='<span style="color:#dc2626">Введи почту</span>';return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Отправляю...';
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});
  btn.disabled=false;btn.textContent='Прислать ссылку';
  msg.innerHTML=error
    ?'<span style="color:#dc2626">'+error.message+'</span>'
    :'<span style="color:#059669">Ссылка ушла на '+email+'. Открой письмо на этом же устройстве.</span>';
}
async function signOut(){await sb.auth.signOut();location.reload();}

/* ============ старт ============ */
async function boot(){
  const cfg=window.TRACKER_CONFIG||{};
  const bootEl=document.getElementById('boot');
  if(!cfg.SUPABASE_URL){
    bootEl.innerHTML='Не заполнен <b>config.js</b>: нужны SUPABASE_URL и SUPABASE_ANON_KEY.';
    return;
  }
  sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    bootEl.style.display='none';
    document.getElementById('loginBox').style.display='';
    return;
  }
  user=session.user;
  try{await loadAll();}
  catch(e){
    bootEl.innerHTML='Не удалось загрузить данные: '+e.message+
      '<br><span class="hint">Проверь, что schema_lovlead.sql выполнен в Supabase.</span>';
    return;
  }
  document.getElementById('whoBtn').textContent=user.email+' · выйти';
  bootEl.style.display='none';
  document.getElementById('app').style.display='';
  render();
}
boot();
</script>
</body>
</html>
